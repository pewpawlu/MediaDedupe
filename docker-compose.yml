services:
  mediadedupe:
    container_name: mediadedupe
    image: ghcr.io/parcival42/mediadedupe:latest

    ports:
      - "18473:8080"

    volumes:
      # Media library - read only
      - /volume1/media:/media:ro

    tmpfs:
      # Disposable MediaDedupe database/cache/state
      - /data

    command: ["-d", "/media"]

    restart: unless-stopped

    environment:
      - TZ=America/Chicago
      - AUTH_SECRET=${AUTH_SECRET}
      - DUPFINDER_DATA=/data

    networks:
      - mediadedupe_isolated

networks:
  mediadedupe_isolated:
    driver: bridge
    internal: true
