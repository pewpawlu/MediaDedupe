services:
  mediadedupe:
    container_name: mediadedupe
    image: ghcr.io/parcival42/mediadedupe:latest

    ports:
      - "18473:8080"

    volumes:
      - /volume1/media:/media:ro

    tmpfs:
      - /data

    command: ["-d", "/media"]

    restart: unless-stopped

    environment:
      - TZ=America/Chicago
      - AUTH_SECRET=${AUTH_SECRET}
      - DUPFINDER_DATA=/data
